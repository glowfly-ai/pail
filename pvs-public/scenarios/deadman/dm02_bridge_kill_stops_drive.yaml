version: 2.0
name: bridge_kill_stops_drive_output
robot_id: robot-1
profile: insecure
steps:
  - {t: 0.0, north_cmd: submit_plan, steps: [{step_id: s1, type: TWIST,
       target_object_id: "880123", twist: {linear_x: 0.2, duration_sec: 5.0}}]}
  - {t: 0.3, inject_evidence: {source: BARCODE, object_id: "880123", confidence: 0.95}}
  - {t: 0.6, inject_cmd_vel: {lin: 0.2, rate: 10, dur: 5.0}}
  - {t: 1.0, expect_drive: {linear_x: 0.2, tol: 0.02}}
  - {t: 2.0, fault: {kill: bridge, signal: 9}}
  # with the bridge dead, no further 0.2 command may reach the driver
  - {t: 2.3, expect_drive_never: {linear_x: 0.2, within_ms: 500}}
