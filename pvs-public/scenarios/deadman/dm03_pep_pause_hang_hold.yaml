version: 2.0
name: pep_pause_hang_triggers_hold
robot_id: robot-1
profile: insecure
# SIGSTOP (pause) simulates a hung PEP that stops emitting permits without dying.
# The deadman must HOLD on missing heartbeats — silence is treated as unsafe.
steps:
  - {t: 0.0, north_cmd: submit_plan, steps: [{step_id: s1, type: TWIST,
       target_object_id: "880123", twist: {linear_x: 0.2, duration_sec: 5.0}}]}
  - {t: 0.3, inject_evidence: {source: BARCODE, object_id: "880123", confidence: 0.95}}
  - {t: 0.6, inject_cmd_vel: {lin: 0.2, rate: 10, dur: 5.0}}
  - {t: 1.0, expect_bridge: {state: FORWARDING}}
  - {t: 2.0, fault: {pause: pep_gate}}
  - {t: 3.0, expect_bridge: {state: HOLD}}
  - {t: 3.0, expect_permit: {present: false, observe_window_ms: 300}}
  - {t: 3.0, expect_bridge: {state: HOLD, within_ms_of_fault: 200}, only: nightly}
