# OWNERSHIP.yaml — PVS 축 소유권 최초 부여 (implementation contract, E-9-1~3).
# PVS 는 적대적 스위트라 보증을 소유하지 않는다(owns 항상 []) — L1 소유자의
# 보증이 실전 배선에서도 성립하는지 교차 확인할 뿐이다(§3.2).
# also_touched_by = tests/GUARANTEES.yaml 에 등재된 ID 만.
# future_refs   = HLD §3 카탈로그에는 있으나 아직 미등재인 ID (planned 상태를
#                 레지스트리에 만들지 않는 편차 — CG-A "planned 는 실패" 불변 유지).
axis: functional
scenarios:
  - id: fn01_normal_match
    owns: []
    also_touched_by: []
    future_refs: [G-ISS-01, G-EVI-01]   # 양성 대조: 유효 발급 → PERMIT → 구동 + 체인 PASS
    delegated_to: null
  - id: fn02_target_mismatch
    owns: []
    also_touched_by: [G-ENF-02, G-EVI-05, G-CTR-04]   # BLOCK + 서명 버스트 + 사유↔코드
    future_refs: []
    delegated_to: null
  - id: fn03_no_token
    owns: []
    also_touched_by: [G-ENF-01]
    future_refs: []
    delegated_to: null
  - id: fn04_no_evidence
    owns: []
    also_touched_by: [G-ENF-03]
    future_refs: []
    delegated_to: null
  - id: fn05_grpc_disabled
    owns: []
    also_touched_by: [G-ENF-10]
    future_refs: []
    delegated_to: null
    note: 라이브 전용 — no-grpc 게이트 빌드 필요 (NEEDS_NO_GRPC_BUILD)
