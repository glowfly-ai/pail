version: 2.0
name: cmd_vel_without_token_blocked
robot_id: robot-1
profile: insecure
steps:
  # no submit_plan → no token issued; a bare cmd_vel must never pass
  - {t: 0.3, inject_evidence: {source: BARCODE, object_id: "880123", confidence: 0.95}}
  - {t: 0.6, inject_cmd_vel: {lin: 0.2, rate: 10, dur: 2.0}}
  - {t: 1.0, expect_gate: {state: BLOCK, reason: ERR_NO_TOKEN}}
  - {t: 1.3, expect_drive_never: {linear_x: 0.2}}
expectations_global:
  - audit_chain: PASS
