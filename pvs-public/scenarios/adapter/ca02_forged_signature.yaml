# CA-02 (contract I-2): a token whose signature does not verify is BLOCKed (ERR_TAMPERED) and
# nothing reaches the robot. Same steps as token/ti03 minus the SAFE_STOP recovery part that
# belongs to the ROS rig. The variant is served by the token seam in front of the adapter.
version: 2.0
name: adapter_forged_signature_blocks
robot_id: robot-1
profile: insecure
steps:
  - {t: 0.0, north_cmd: submit_plan, token_variant: forge_signature, steps: [{step_id: s1,
       type: TWIST, target_object_id: "880123", twist: {linear_x: 0.2, duration_sec: 2.0}}]}
  - {t: 0.3, inject_evidence: {source: BARCODE, object_id: "880123", confidence: 0.95}}
  - {t: 0.6, inject_cmd_vel: {lin: 0.2, rate: 10, dur: 2.0}}
  - {t: 1.0, expect_gate: {state: BLOCK, reason: ERR_TAMPERED}}
  - {t: 1.3, expect_drive_never: {linear_x: 0.2}}
expectations_global:
  - audit_chain: PASS
