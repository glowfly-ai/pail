# CA-03: an expired token (not_after 5 s in the past) is BLOCKed (ERR_EXPIRED). token/ti05 marks
# every step `only: nightly` because the ROS rig needs a faketime boot for the boundary; here
# the seam mints the expired token directly, so the steps run on every tier.
version: 2.0
name: adapter_expired_token_blocks
robot_id: robot-1
profile: insecure
steps:
  - {t: 0.0, north_cmd: submit_plan, token_variant: expire, delta_ms: -5000, steps: [{step_id: s1,
       type: TWIST, target_object_id: "880123", twist: {linear_x: 0.2, duration_sec: 2.0}}]}
  - {t: 0.3, inject_evidence: {source: BARCODE, object_id: "880123", confidence: 0.95}}
  - {t: 0.6, inject_cmd_vel: {lin: 0.2, rate: 10, dur: 2.0}}
  - {t: 1.0, expect_gate: {state: BLOCK, reason: ERR_EXPIRED}}
  - {t: 1.3, expect_drive_never: {linear_x: 0.2}}
expectations_global:
  - audit_chain: PASS
