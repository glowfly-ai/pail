version: 2.0
name: stale_safety_feed_forbids_new_permit
robot_id: robot-1
profile: insecure
# Safety publishes SAFE, then stops (feed goes stale). Once age > SAFETY_STALE_MS
# the gate must treat the feed as WARN: no NEW permit may be granted. A fresh plan
# submitted under the stale feed is BLOCKed with ERR_SAFETY_STALE and never drives.
steps:
  - {t: 0.0, inject_safety: {level: OK}}
  - {t: 0.3, inject_safety: {stale: true}}    # stop publishing → let it age out
  - {t: 1.5, north_cmd: submit_plan, steps: [{step_id: s1, type: TWIST,
       target_object_id: "880123", twist: {linear_x: 0.2, duration_sec: 2.0}}]}
  - {t: 1.8, inject_evidence: {source: BARCODE, object_id: "880123", confidence: 0.95}}
  - {t: 2.0, inject_cmd_vel: {lin: 0.2, rate: 10, dur: 2.0}}
  - {t: 2.4, expect_gate: {state: BLOCK, reason: ERR_SAFETY_STALE}}
  - {t: 2.7, expect_drive_never: {linear_x: 0.2}}
