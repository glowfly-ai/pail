version: 2.0
name: segment_byte_tamper_detected
robot_id: robot-1
profile: insecure
# Produce a valid chain, then flip a byte inside the latest segment. The verifier
# must report FAIL at exactly the tampered record index (proven at unit level in
# tests/test_verifiers.py; here we assert the end-to-end chain verdict flips to
# FAIL). Note the global audit_chain expectation is FAIL for this scenario.
steps:
  - {t: 0.0, north_cmd: submit_plan, steps: [{step_id: s1, type: TWIST,
       target_object_id: "880123", twist: {linear_x: 0.1, duration_sec: 2.0}}]}
  - {t: 0.3, inject_evidence: {source: BARCODE, object_id: "880123", confidence: 0.95}}
  - {t: 0.6, inject_cmd_vel: {lin: 0.1, rate: 20, dur: 2.0}}
  - {t: 1.0, expect_gate: {state: PERMIT, reason: OK}}
  - {t: 2.5, fault: {diskcorrupt: {mode: flip, byte_index: 80}}}
  - {t: 2.8, expect_audit: {chain: FAIL}}
expectations_global:
  - audit_chain: FAIL
