version: 2.0
name: expired_token_boundary_blocked
robot_id: robot-1
profile: insecure
# not_after boundary: token minted already expired (not_after in the past). The
# gate must reject on the time window. Runs under a libfaketime boot profile so
# the offset is deterministic (see §6.1). ERR_CLOCK (runtime skew, which cannot
# be isolated when containers share host CLOCK_REALTIME) is delegated to Go unit
# tests — this scenario only proves the not_after boundary, marked nightly since
# it requires the faketime boot profile.
steps:
  - {t: 0.0, north_cmd: submit_plan, token_variant: expire, delta_ms: -5000, only: nightly,
       steps: [{step_id: s1, type: TWIST, target_object_id: "880123",
       twist: {linear_x: 0.2, duration_sec: 2.0}}]}
  - {t: 0.3, inject_evidence: {source: BARCODE, object_id: "880123", confidence: 0.95}, only: nightly}
  - {t: 0.6, inject_cmd_vel: {lin: 0.2, rate: 10, dur: 2.0}, only: nightly}
  - {t: 1.0, expect_gate: {state: BLOCK, reason: ERR_EXPIRED}, only: nightly}
  - {t: 1.3, expect_drive_never: {linear_x: 0.2}, only: nightly}
expectations_global:
  - audit_chain: PASS
