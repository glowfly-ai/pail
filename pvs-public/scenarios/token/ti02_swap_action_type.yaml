version: 2.0
name: swapped_action_type_blocked
robot_id: robot-1
profile: insecure
# Token is validly signed by the issuer but its action_type is swapped
# (TWIST -> PICK). The gate must reject on action mismatch, not signature.
# token_variant selects the mock_ai negative factory (swap_action_type).
steps:
  - {t: 0.0, north_cmd: submit_plan, token_variant: swap_action, steps: [{step_id: s1,
       type: TWIST, target_object_id: "880123", twist: {linear_x: 0.2, duration_sec: 2.0}}]}
  - {t: 0.3, inject_evidence: {source: BARCODE, object_id: "880123", confidence: 0.95}}
  - {t: 0.6, inject_cmd_vel: {lin: 0.2, rate: 10, dur: 2.0}}
  - {t: 1.0, expect_gate: {state: BLOCK, reason: ERR_ACTION_MISMATCH}}
  - {t: 1.3, expect_drive_never: {linear_x: 0.2}}
expectations_global:
  - audit_chain: PASS
