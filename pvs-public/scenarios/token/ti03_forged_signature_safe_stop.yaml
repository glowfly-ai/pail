version: 2.0
name: forged_signature_blocks_and_safe_stops
robot_id: robot-1
profile: insecure
# A token with a flipped signature byte. The Ed25519 verify fails, so the gate
# BLOCKs with ERR_TAMPERED (strict_verify.cpp). ERR_TAMPERED is in the operator
# service's forgeryReasons set, so it drives NORMAL -> SAFE_STOP (recoverable),
# NOT issuer-key LOCKDOWN. The SAFE_STOP transition + Operator Unlock recovery is
# proven in the recovery axis (rc01) — there is no DSL observation verb for the
# operator-service state, and SAFE_STOP does not raise a ROS stop_request (that
# is reserved for safety ESTOP). Here we assert the observable gate + no drive.
steps:
  - {t: 0.0, north_cmd: submit_plan, token_variant: forge_signature, steps: [{step_id: s1,
       type: TWIST, target_object_id: "880123", twist: {linear_x: 0.2, duration_sec: 2.0}}]}
  - {t: 0.3, inject_evidence: {source: BARCODE, object_id: "880123", confidence: 0.95}}
  - {t: 0.6, inject_cmd_vel: {lin: 0.2, rate: 10, dur: 2.0}}
  - {t: 1.0, expect_gate: {state: BLOCK, reason: ERR_TAMPERED}}
  - {t: 1.3, expect_drive_never: {linear_x: 0.2}}
expectations_global:
  - audit_chain: PASS
