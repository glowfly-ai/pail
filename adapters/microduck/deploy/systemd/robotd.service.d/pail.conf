# Drop-in for the upstream robotd.service — installed to
# /etc/systemd/system/robotd.service.d/pail.conf (deploy/install.sh).
#
# Moves robotd's control socket behind the PAIL adapter (LLD §5, §9). Upstream's own
# robotd.service is NOT edited: the updater installs that file from every release artifact
# (updater/src/config.rs — `<unit>/systemd/<unit>.service` ships with the binary), so an
# edit there would be overwritten by the next update. A drop-in is a separate file that
# systemd merges on top of whatever unit the release installs — that is the mechanism
# systemd gives for exactly this, and the updater's orphan check only reads *.service
# files (updater/src/orphan.rs), never .d/ directories. See INSTALL.md §4 (R1).
#
# What changes and why:
#   Group=pail            — the raw socket inherits the process's primary group, so this
#                           is what makes root:pail 0660 mean "the adapter only".
#                           `robot` group members can no longer open it (contract I-1).
#   RuntimeDirectoryMode  — /run/robotd (identity.json, and now the raw socket) is 0750:
#                           robot-group clients cannot even enter the directory.
#   ExecStart=            — the empty line resets upstream's ExecStart (systemd rule);
#                           the second line is upstream's command with the socket moved
#                           into /run/robotd. Review this line on every upstream release:
#                           if robotd's binary path or flags change, this override must
#                           follow (INSTALL.md §4).
[Service]
Group=pail
RuntimeDirectoryMode=0750
ExecStart=
ExecStart=/opt/robot/daemon/current/bin/robotd --socket /run/robotd/raw.sock
