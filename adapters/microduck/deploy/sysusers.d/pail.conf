# Creates the `pail` system group.
#
# Install to /usr/lib/sysusers.d/pail.conf; systemd-sysusers creates it at boot, or run
# `systemd-sysusers` once by hand (deploy/install.sh does).
#
# This group is what closes the raw ingress (contract I-1): robotd's raw socket becomes
# root:pail 0660 inside /run/robotd 0750, and pail-duckd runs with Group=pail. Nothing
# else is a member. A process in `robot` (padd, btd, the SDK, mediad) reaches the robot
# only through the adapter's public socket.
g pail -
