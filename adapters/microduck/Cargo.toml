[package]
name = "pail-duckd"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Experimental PAIL Microduck adapter: action authorization before robotd"
license = "Apache-2.0"
publish = false

[[bin]]
name = "pail-duckd"
path = "src/main.rs"

[dependencies]
# The upstream IPC vocabulary, pinned to the commit the analysis and the LLD were written
# against (LLD D2). Not copied: a copy would go quiet the day upstream adds a method, and the
# exhaustive match in `classify.rs` is what turns that day into a compile error instead.
# Adapter v2 (2026-10-26): upstream 0.17.8, API 44.
duck-ipc-proto = { git = "https://github.com/pollen-robotics/microduck.git", rev = "942e58e3aa6dbb28e7037203fff11866122c7567" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Skill name table (LLD §3.1, /etc/pail/duck_skills.yaml) — the one YAML the adapter reads.
serde_yaml = "0.9"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"

# gRPC to the PAIL robot agent (contract ⑤: GetActiveToken / ReportDecision / Attest).
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
tower = "0.5"
hyper-util = { version = "0.1", features = ["tokio"] }
sha2 = "0.11"

[features]
default = []
# Link libpail_gate (AD-1) and enable the enforcing LibGate. Requires PAIL_GATE_LIB_DIR.
libgate = []

[build-dependencies]
tonic-prost-build = "0.14"

[profile.release]
debug = 1
