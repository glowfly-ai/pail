# TB-7 배선 픽스처 (LLD-POLCLASS §3.3).
#
# 이 배터리들은 "게이트가 옳게 판정하는가"가 아니라 "노드가 기동하고 배선이
# 붙는가"를 잰다. D-L2 이전에는 존재하지 않는 경로(/nonexistent-tb7-policy.yaml)를
# 줘서 "부재 = 결측 = enforce" 경로로 기동했다. 이제 부재는 기동 거부이므로
# 최소 정책이 필요하다.
#
# 값은 D-L1 이전의 노드 기본값과 **같다**(0.90, 그리고 preconditions 의 2000·1000).
# 이 배터리들은 임계가
# 정책에서 온다는 것을 재지 않는다 — 그것을 재는 것은 test_gate_polclass 이고,
# 거기서는 값이 기본값과 **일부러 다르다**(250 · 0.99). 두 배터리의 픽스처가
# 다른 이유가 이것이다: 같은 파일을 쓰면 배선 배터리가 P-19 를 우연히 가린다.
#
# 바이트를 바꾸면 config seal 의 policy_file_sha256 이 바뀐다(RQ-7). 그때
# test_gate_profile / test_gate_deadman_seal 의 거울이 붉어진다 — 그것이 결함이
# 아니라 이 파일이 봉인의 입력이라는 증거다.
#
# D-L5 (§12 단계 5): 게이트가 신뢰 클래스를 읽게 되면서 이 파일도 `trust_classes`
# 와 `evidence.min_trust_class`, `preconditions[safety_feed]` 를 갖게 됐다.
# 없으면 기동이 거부된다 — 부재는 기본값이 아니다(D-L2).
#
# 🚩 바닥이 `inferential` 인 것은 **의도된 차이**다. 생산 `config/policy.yaml` 은
# `identity_bearing` 을 쓴다. 이 배터리들(특히 test_gate_evidence)은 VISION 증거로
# PERMIT 대조행을 세우고 있고, 그 대조행이 재는 것은 배선이지 신뢰 클래스가
# 아니다. 생산 바닥을 그대로 적으면 배선 배터리가 신뢰 클래스 때문에 붉어져
# **"배선이 끊겼다"와 "증거 종류가 모자란다"가 같은 붉은 줄로 도착한다**(H-B2).
# 신뢰 클래스를 재는 것은 test_gate_polclass 이고 거기 픽스처는 `identity_bearing`
# 이다 — 두 픽스처가 다른 이유는 P-19 때와 같다.
#
# `revocation_classes` 와 `horizon` 은 **일부러 없다.** 최소 픽스처에 이 배터리가
# 재지 않는 절을 적으면 다음 사람이 이 파일을 스키마의 정본으로 읽는다.
#
# D-L8 (2026-08-23): 게이트가 `revocation_classes` 를 **읽기는 한다** — 판정하지는
# 않고 seal 배너에 사실로 적을 뿐이다(스키마의 권위는 발급자 하나). 그래서 이
# 파일로 기동하면 배너에 "revocation_classes is not declared…" 한 줄이 는다. 그
# 줄은 결함이 아니라 **이 파일이 그 절을 안 적었다는 사실**이다 — 침묵으로 두면
# "선언된 철회가 전부 유한하다"와 같은 바이트가 된다(H-B2). `horizon` 은 여전히
# 게이트가 읽지 않는다(발급자만 읽는다).
gate_mode: enforce
human_safety:
  enabled: true
evidence:
  confidence_threshold: 0.90
  min_trust_class: inferential
preconditions:
  - id: safety_feed
    class: must_check_live
    freshness_ms: 1000
    exempt_in_progress_step: true
  - id: evidence_claim
    class: must_check_live
    freshness_ms: 2000
    exempt_in_progress_step: false
trust_classes:
  - id: identity_bearing
    rank: 3
    sources: [RFID, NFC, BARCODE]
  - id: inferential
    rank: 2
    sources: [VISION]
  - id: asserted
    rank: 1
    sources: [MANUAL]
