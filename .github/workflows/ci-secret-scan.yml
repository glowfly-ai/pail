# 공개 리포의 비밀 스캔 워크플로 .
#
# 내부 리포의 `.github/workflows/` 에 두지 않는 이유가 둘이다.
#   1. 설계서 §2.5: 기존 스모크 워크플로에 얹지 않는다 — 스모크가 실패해도 스캔은
#      돌아야 한다.
#   2. 이 파일이 부르는 경로(`spec/tools/…`, `robot/…`)는 **공개 배치**의 것이다.
#      내부 트리에 두면 자기가 사는 트리에서 돌 수 없는 워크플로가 된다. 그 형태가
#      바로 직전 커밋(OR6 커밋6)에서 고친 결함이다.
#
# 두 층을 돌린다. 층마다 **양성 대조를 먼저** 놓는다 — "적중 0" 과 "스캐너가
# 죽었다" 는 CI 로그에서 같은 바이트이기 때문이다. 대조군은 매 실행 난수로 만든다:
# 실제 키의 사본을 CI 가 만들면 그 자체가 다음 위반 사례가 된다.
#
# 모든 스캔에 `--redact` 가 붙는다. 공개 리포의 CI 로그는 누구나 본다 — 스캐너의
# 실패 로그가 비밀의 새 사본이 되어서는 안 된다(§2.5).

name: secret-scan

on: [push, pull_request]

permissions:
  contents: read

env:
  # 태그를 고정한다. `:latest` 는 어제 붉던 것이 오늘 초록일 수 있고, 그 변화가
  # 커밋에 남지 않는다.
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1
  TSV: robot/pail_deploy_guard/known_dev_keys.tsv

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 이력 전수를 본다. 트리에 비밀이 없는 것과 이력에 없는 것은 다른 조건이고,
          # 한 번 커밋된 개인키는 지워도 이력에 남는다.
          fetch-depth: 0

      # ── 1층 ────────────────────────────────────────────────────────────────
      - name: Positive control - synthetic key detection
        run: |
          set -euo pipefail
          mkdir -p /tmp/glprobe
          python3 - <<'PY'
          import base64, hashlib, os, secrets
          d = "/tmp/glprobe"
          note = "PRIVATE+KEY+ci-probe-anchor-log+%s+%s" % (
              hashlib.sha256(secrets.token_bytes(16)).hexdigest()[:8],
              base64.b64encode(b"\x01" + secrets.token_bytes(32)).decode())
          open(os.path.join(d, "probe_note.txt"), "w").write(note + "\n")
          open(os.path.join(d, "probe_key.pem"), "w").write(
              "-----BEGIN PRIVATE KEY-----\n%s\n-----END PRIVATE KEY-----\n"
              % base64.b64encode(secrets.token_bytes(48)).decode())
          PY
          docker run --rm \
            -v /tmp/glprobe:/probe:ro \
            -v "$PWD/.gitleaks.toml:/cfg/.gitleaks.toml:ro" \
            -v /tmp:/out \
            "$GITLEAKS_IMAGE" dir /probe --config=/cfg/.gitleaks.toml \
            --redact --no-banner --exit-code=0 \
            --report-format=json --report-path=/out/probe.json
          python3 - <<'PY'
          import json, sys
          rules = {f["RuleID"] for f in json.load(open("/tmp/probe.json"))}
          want = {"private-key", "pail-note-private-key"}
          print("CI detail - Positive control - synthetic key detection", sorted(rules))
          missing = want - rules
          if missing:
              sys.exit("놓친 규칙 %s — 이 실행의 1층 초록은 무증거다" % sorted(missing))
          PY
          rm -rf /tmp/glprobe /tmp/probe.json

      - name: Gitleaks public history scan
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/scan:ro" "$GITLEAKS_IMAGE" \
            detect --source=/scan --config=/scan/.gitleaks.toml \
            --redact --no-banner --exit-code=1

      # ── 2층 ────────────────────────────────────────────────────────────────
      - name: Positive control - fingerprint drift
        run: |
          set -euo pipefail
          # 저장소를 건드리지 않는다. 프로브가 재려던 상태를 스스로 없애면 그 부재를
          # 측정하게 된다.
          rm -rf /tmp/l2probe
          cp -R "$PWD" /tmp/l2probe
          python3 - <<'PY'
          import os
          p = os.path.join("/tmp/l2probe", os.environ["TSV"])
          lines = open(p, encoding="utf-8").read().splitlines(True)
          for i, ln in enumerate(lines):
              if ln[:1] in "0123456789abcdef":
                  c = ln[0]
                  lines[i] = ("f" if c != "f" else "0") + ln[1:]
                  break
          else:
              raise SystemExit("Cannot construct/validate CI control - Positive control - fingerprint drift")
          open(p, "w", encoding="utf-8").writelines(lines)
          PY
          if ( cd /tmp/l2probe && python3 spec/tools/gen_known_dev_keys.py --check ); then
            echo "Unexpected result - Positive control - fingerprint drift. Inspect the preceding command output."
            exit 1
          fi
          echo "Positive control confirmed - Positive control - fingerprint drift"
          rm -rf /tmp/l2probe

      - name: Generated fingerprint drift
        run: python3 spec/tools/gen_known_dev_keys.py --check

      - name: Fingerprint history monotonicity
        run: |
          set -euo pipefail
          # 기준은 첫 부모의 목록이다. push 에서는 직전 커밋, PR 에서는 병합 대상
          # 브랜치의 끝이 된다 — 한 규칙이 둘을 덮는다.
          if ! git rev-parse --verify -q HEAD^ >/dev/null; then
            echo "UNMEASURABLE: no parent history for this first commit; this is not a passing measurement."
            echo "UNMEASURABLE: no parent history for this first commit; this is not a passing measurement."
            exit 0
          fi
          if ! git show "HEAD^:$TSV" > /tmp/base.tsv; then
            echo "Unexpected result - Fingerprint history monotonicity. Inspect the preceding command output."
            exit 1
          fi
          python3 spec/tools/gen_known_dev_keys.py --check-monotone /tmp/base.tsv
