          open(p, "w", encoding="utf-8").write(s.replace('meta[name="pail-robotops"]', 'meta[name="x"]'))
          print("CI detail - Positive control - robotops.js without the page capability")
          PY
          rc=0; ( cd /tmp/clsprobe && python3 spec/tools/spec_class_check.py ) || rc=$?
