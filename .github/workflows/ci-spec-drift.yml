          open(p, "w", encoding="utf-8").write(s.replace("test_fatal_latch", "test_no_such_test", 1))
          print("CI detail - Positive control - transition table cites a missing test")
          PY
          rc=0; ( cd /tmp/trprobe && python3 spec/tools/spec_transitions_check.py ) || rc=$?
