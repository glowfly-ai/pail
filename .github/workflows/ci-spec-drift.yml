#
# `ci-secret-scan.yml` 과 합치지 않는다. 비밀 스캔은 "나가면 안 되는 것이 나갔는가"를
# 묻고 이 검사는 "게시한 주장이 실린 것과 같은가"를 묻는다 — 한쪽이 죽었을 때 다른
# 쪽까지 함께 조용해지면 안 된다.
#
# 이 워크플로가 부르는 경로는 공개 배치의 것이라 내부 트리에서는 돌지 않는다. 그래서
# 머리말에 있다).
#
# 양성 대조를 먼저 놓는다. "FAIL 0" 과 "검사기가 죽었다" 는 CI 로그에서 같은 바이트다.

name: spec-drift

on: [push, pull_request]

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Public content boundaries
        run: python3 scripts/check_public_content.py

      - name: Public onboarding file links
        run: python3 scripts/check_public_links.py

      - name: Release identity and document target
        run: python3 scripts/release_identity.py

      - name: Positive control - stale release document
        run: |
          python3 - <<'PY'
          import pathlib, shutil, subprocess, sys, tempfile
          with tempfile.TemporaryDirectory(prefix='pail-release-control-') as work:
              root = pathlib.Path(work)
              for name in ['release.json', 'VERSION', 'RELEASE.md']:
                  shutil.copy2(name, root / name)
              p = root / 'RELEASE.md'
              p.write_text(p.read_text().replace('public-candidate-', 'previous-candidate-'))
              result = subprocess.run([sys.executable, 'scripts/release_identity.py', '--root', str(root)])
              if result.returncode != 1:
                  raise SystemExit('Stale release document was not rejected')
          PY

      - name: Positive control - stale vector set hash
        run: |
          set -euo pipefail
          # 저장소를 건드리지 않는다. 프로브가 재려던 상태를 스스로 없애면 그 부재를
          # 측정하게 된다.
          rm -rf /tmp/sdprobe
          cp -R "$PWD" /tmp/sdprobe
          python3 - <<'PY'
          import os, re
          root = "/tmp/sdprobe"
          man = os.path.join(root, "spec/vectors/canon/MANIFEST.sha256")
          cur = re.search(r"^set_sha256\s+([0-9a-f]{64})", open(man, encoding="utf-8").read(),
                          re.M).group(1)
          # 매니페스트 머리말이 남겨 둔 **실제 이전 판**을 쓴다. 아무 값이나 지어내면
          # 이 대조가 재는 것이 "표류 검출" 이 아니라 "hex 문자열 비교" 로 내려앉는다.
          old = None
          for ln in open(man, encoding="utf-8"):
              if ln.startswith("#"):
                  for h in re.findall(r"\b[0-9a-f]{64}\b", ln):
                      if h != cur:
                          old = h
                          break
              if old:
                  break
          if not old:
              raise SystemExit("Cannot construct/validate CI control - Positive control - stale vector set hash")
          hit = 0
          for base, dirs, names in os.walk(root):
              dirs[:] = [d for d in dirs if not d.startswith(".")]
              for n in names:
                  if not n.endswith(".md"):
                      continue
                  p = os.path.join(base, n)
                  if "/spec/vectors/" in p.replace(os.sep, "/"):
                      continue
                  t = open(p, encoding="utf-8").read()
                  if cur[:8] in t:
                      open(p, "w", encoding="utf-8").write(t.replace(cur[:8], old[:8]))
                      hit += 1
          if not hit:
              raise SystemExit("Cannot construct/validate CI control - Positive control - stale vector set hash")
          print("CI detail - Positive control - stale vector set hash; values: %d, %s, %s" % (hit, cur[:8], old[:8]))
          PY
          if ( cd /tmp/sdprobe && python3 spec/tools/spec_conformance_check.py ); then
            echo "Unexpected result - Positive control - stale vector set hash. Inspect the preceding command output."
            exit 1
          fi
          echo "Positive control confirmed - Positive control - stale vector set hash"
          rm -rf /tmp/sdprobe

      - name: Conformance claims
        run: python3 spec/tools/spec_conformance_check.py

      - name: Positive control - unregistered unpinned section
        run: |
          set -euo pipefail
          rm -rf /tmp/scprobe
          cp -R "$PWD" /tmp/scprobe
          # 실린 벡터에도 없고 UNPINNED.tsv 에도 없는 접두어를 "핀 없음" 으로 선언한다.
          # 문서의 기존 내용에 기대지 않는 대조다 — 붙이는 자리가 문서 끝이라
          # 절 하나가 늘어나는 것 말고는 아무것도 건드리지 않는다.
          # 접두어를 변수로 빼는 것은 취향이 아니다: 이 리터럴은 canon 드리프트
          # 스캐너에게 레지스트리 밖 접두어의 실제 출현이고, 스캐너는 의도를 못 본다.
          FAKE='pail-nosuchthing:v9'  # PAIL-CANON-NEGATIVE
          printf '\n### `%s`\n\n지어낸 절.\n\n<!-- pin: none -->\n' "$FAKE" \
            >> /tmp/scprobe/spec/CANON.md
          if ( cd /tmp/scprobe && python3 spec/tools/spec_canon_check.py ); then
            echo "Unexpected result - Positive control - unregistered unpinned section. Inspect the preceding command output."
            exit 1
          fi
          echo "Positive control confirmed - Positive control - unregistered unpinned section"
          rm -rf /tmp/scprobe

      - name: Canonical quotation pins
        run: python3 spec/tools/spec_canon_check.py

      - name: Positive control - unknown key kind
        run: |
          set -euo pipefail
          rm -rf /tmp/skprobe
          cp -R "$PWD" /tmp/skprobe
          python3 - <<'PY'
          import re
          p = "/tmp/skprobe/robot/pail_deploy_guard/known_dev_keys.tsv"
          t = open(p, encoding="utf-8").read()
          new, n = re.subn(r"^([0-9a-f]{64})\ted25519\t", r"\1\ted25519x\t", t,
                           count=1, flags=re.M)
          if n != 1:
              raise SystemExit("Cannot construct/validate CI control - Positive control - unknown key kind")
          open(p, "w", encoding="utf-8").write(new)
          print("CI detail - Positive control - unknown key kind")
          PY
          if ( cd /tmp/skprobe && python3 spec/tools/spec_keys_check.py ); then
            echo "Unexpected result - Positive control - unknown key kind. Inspect the preceding command output."
            exit 1
          fi
          echo "Positive control confirmed - Positive control - unknown key kind"
          rm -rf /tmp/skprobe

      - name: Fingerprint list format
        run: python3 spec/tools/spec_keys_check.py

      - name: Positive control - missing parser field
        run: |
          set -euo pipefail
          rm -rf /tmp/smprobe
          cp -R "$PWD" /tmp/smprobe
          # 문서가 아니라 **코드만** 건드린다. 규격 문서가 겨누는 실패는 손으로 쓴
          # 문서가 파서보다 오래 사는 것이므로, 대조군도 파서 쪽에서 와야 한다.
          # 문서를 고쳐 붉히면 "문서를 고치면 붉어진다" 만 증명되고 정작 재려던
          # 방향은 재지 않은 채 남는다.
          python3 - <<'PY'
          p = "/tmp/smprobe/cloud/internal/graph/compile.go"
          t = open(p, encoding="utf-8").read()
          old = '\tHome         string   `yaml:"home"`\n'
          if t.count(old) != 1:
              raise SystemExit("Cannot construct/validate CI control - Positive control - missing parser field")
          open(p, "w", encoding="utf-8").write(t.replace(old, ""))
          print("CI detail - Positive control - missing parser field")
          PY
          if ( cd /tmp/smprobe && python3 spec/tools/spec_site_model_check.py ); then
            echo "Unexpected result - Positive control - missing parser field. Inspect the preceding command output."
            exit 1
          fi
          echo "Positive control confirmed - Positive control - missing parser field"
          rm -rf /tmp/smprobe

      - name: Site model specification
        run: python3 spec/tools/spec_site_model_check.py

      - name: Positive control - interface field mismatch
        run: |
          set -euo pipefail
          rm -rf /tmp/asprobe
          cp -R "$PWD" /tmp/asprobe
          # 여기서도 **소스만** 건드린다. 네 표면의 레퍼런스가 겨누는 실패는 손으로
          # 쓴 문서가 `.proto`/`.msg`/`.hpp` 보다 오래 사는 것이라, 대조군은 소스
          # 쪽에서 와야 한다. 문서를 고쳐 붉히면 "문서를 고치면 붉어진다" 만
          # 증명되고 정작 재려던 방향은 재지 않은 채 남는다.
          python3 - <<'PY'
          p = "/tmp/asprobe/sdk/proto/pail.proto"
          t = open(p, encoding="utf-8").read()
          old = "origin_reason_code = 8"
          if t.count(old) != 1:
              raise SystemExit("Cannot construct/validate CI control - Positive control - interface field mismatch")
          open(p, "w", encoding="utf-8").write(t.replace(old, "origin_reason_kode = 8"))
          print("CI detail - Positive control - interface field mismatch")
          PY
          if ( cd /tmp/asprobe && python3 spec/tools/spec_api_surfaces_check.py ); then
            echo "Unexpected result - Positive control - interface field mismatch. Inspect the preceding command output."
            exit 1
          fi
          echo "Positive control confirmed - Positive control - interface field mismatch"
          rm -rf /tmp/asprobe

      - name: Interface reference
        run: python3 spec/tools/spec_api_surfaces_check.py

      - name: Positive control - undocumented source gate
        run: |
          set -euo pipefail
          rm -rf /tmp/tmprobe
          cp -R "$PWD" /tmp/tmprobe
          # 여기서도 **소스만** 건드린다. 이 검사기가 겨누는 실패는 위협 모델과
          # 경계 문서가 코드보다 오래 사는 것이고, 실제로 그렇게 살았다 —
          # 손으로 관리하던 스캔 경로 목록이 낡아 구현된 게이트 여덟이 경계 문서
          # 밖에 있었다. 그때 문서는 아무 표시 없이 초록이었다.
          #
          # 덧셈형으로 깬다. 게이트 이름을 **바꾸면** 「없어진 이름」과 「새 이름」이
          # 함께 붉어 한 결함이 두 줄로 도착하고, 그러면 이 대조군이 무엇을
          # 재는지가 흐려진다.
          python3 - <<'PY'
          p = "/tmp/tmprobe/cloud/internal/crypto/freshness.go"
          t = open(p, encoding="utf-8").read()
          if 'deploysec.Cfg("S20d"' not in t:
              raise SystemExit("Cannot construct/validate CI control - Positive control - undocumented source gate")
          open(p, "a", encoding="utf-8").write(
              '\n// 대조군: 이 줄은 소스가 게이트 "S98" 을 선언하게 만든다.\n')
          print("CI detail - Positive control - undocumented source gate")
          PY
          if ( cd /tmp/tmprobe && python3 spec/tools/spec_threat_model_check.py ); then
            echo "Unexpected result - Positive control - undocumented source gate. Inspect the preceding command output."
            exit 1
          fi
          echo "Positive control confirmed - Positive control - undocumented source gate"
          rm -rf /tmp/tmprobe

      - name: Threat model
        run: python3 spec/tools/spec_threat_model_check.py

      - name: Positive control - invalid checkpoint signature
        run: |
          set -euo pipefail
          rm -rf /tmp/viprobe
          cp -R "$PWD" /tmp/viprobe
          # 다른 규격과 달리 여기서는 소스가 스냅숏에 없다 — 셋째 꼭짓점은 동결된
          # 실선 바이트다. 그러니 대조군도 거기서 와야 한다. 문서를 고쳐 붉히면
          # "문서를 고치면 붉어진다" 만 증명되고, 이 검사기가 실제로 **서명을
          # 검증하는가** 는 재지 않은 채 남는다 — 그것이 BT-1a 가 찾아낸 결함의
          # 형태다(파싱만 하고 검증하지 않는 검증기).
          #
          # 관문 2(origin)는 여기서 못 잰다. origin 만 어긋나고 서명은 맞는 노트를
          # 만들려면 서명키가 필요한데, 그 키는 트리에 없다(있으면 그 자체가 결함).
          # 그 칸은 tests/tools/deform_or6_spec.py 가 키를 만들어 낸 뒤 잰다.
          python3 - <<'PY'
          import base64
          p = "/tmp/viprobe/spec/proof-vectors/checkpoint.note"
          raw = open(p, "rb").read()
          cut = raw.find(b"\n\n")
          if cut < 0:
              raise SystemExit("Cannot construct/validate CI control - Positive control - invalid checkpoint signature")
          head, sig = raw[:cut + 2], raw[cut + 2:].decode()
          who, b64 = sig.strip().split(" ", 2)[1:]
          blob = bytearray(base64.b64decode(b64))
          if len(blob) != 68:
              raise SystemExit("Cannot construct/validate CI control - Positive control - invalid checkpoint signature; values: %d" % len(blob))
          blob[40] ^= 0x01              # 서명 안쪽 1비트. 본문은 그대로다.
          open(p, "wb").write(
              head + ("— %s %s\n" % (who, base64.b64encode(bytes(blob)).decode())).encode())
          print("CI detail - Positive control - invalid checkpoint signature")
          PY
          if ( cd /tmp/viprobe && python3 spec/tools/spec_verification_inputs_check.py ); then
            echo "Unexpected result - Positive control - invalid checkpoint signature. Inspect the preceding command output."
            exit 1
          fi
          echo "Positive control confirmed - Positive control - invalid checkpoint signature"
          rm -rf /tmp/viprobe

      - name: Verification input specification
        run: python3 spec/tools/spec_verification_inputs_check.py

      - name: Positive control - non-power-of-two proof branches
        run: |
          set -euo pipefail
          rm -rf /tmp/mvprobe
          cp -R "$PWD" /tmp/mvprobe
          # 여기서 대조군은 **데이터가 아니라 도구**다. 다른 규격에서 하듯 실린
          # 벡터 바이트를 한 비트 뒤집으면 MANIFEST.sha256 대조(K1)가 먼저 붉는다 —
          # 그러면 이 실행이 증명하는 것은 "매니페스트가 동작한다" 뿐이고, 이 세트가
          # 존재하는 이유인 **RFC 6962 산술이 실제로 걸려 있는가** 는 재지 않은 채
          # 남는다. 그래서 검증기 자신을 깬다.
          #
          # 두 변형은 2026-08-30 에 실측한 그 둘이다. 당시 이 둘은 BT-1b 가 실은
          # 열여덟 벡터(트리 크기 1·2·4)를 **전부 통과했다** — 공개한 것을 다 통과하는
          # 틀린 검증기가 가능했다는 뜻이고, BT-1c 는 정확히 그 구멍을 메우려고 있다.
          python3 - <<'PY'
          p = "/tmp/mvprobe/spec/tools/spec_merkle_vectors_check.py"
          s = open(p, encoding="utf-8").read()
          old = ("            r = node_hash(p, r)\n"
                 "            while fn != 0 and (fn & 1) == 0:\n"
                 "                trace['border'] = True\n"
                 "                fn >>= 1\n"
                 "                sn >>= 1\n")
          if s.count(old) != 1:
              raise SystemExit("Cannot construct/validate CI control - Positive control - non-power-of-two proof branches")
          open(p, "w", encoding="utf-8").write(s.replace(old, "            r = node_hash(p, r)\n"))
          print("CI detail - Positive control - non-power-of-two proof branches")
          PY
          if ( cd /tmp/mvprobe && python3 spec/tools/spec_merkle_vectors_check.py ); then
            echo "Unexpected result - Positive control - non-power-of-two proof branches. Inspect the preceding command output."
            exit 1
          fi
          echo "Positive control confirmed - Positive control - non-power-of-two proof branches"

          rm -rf /tmp/mvprobe && cp -R "$PWD" /tmp/mvprobe
          python3 - <<'PY'
          p = "/tmp/mvprobe/spec/tools/spec_merkle_vectors_check.py"
          s = open(p, encoding="utf-8").read()
          old = ("    else:\n"
                 "        trace['seed_from_proof'] = True\n"
                 "        seed, start = proof[0], 1\n")
          if s.count(old) != 1:
              raise SystemExit("Cannot construct/validate CI control - Positive control - non-power-of-two proof branches")
          new = ("    else:\n"
                 "        trace['seed_from_proof'] = True\n"
                 "        seed, start = root1, 0\n")
          open(p, "w", encoding="utf-8").write(s.replace(old, new))
          print("CI detail - Positive control - non-power-of-two proof branches")
          PY
          if ( cd /tmp/mvprobe && python3 spec/tools/spec_merkle_vectors_check.py ); then
            echo "Unexpected result - Positive control - non-power-of-two proof branches. Inspect the preceding command output."
            exit 1
          fi
          echo "Positive control confirmed - Positive control - non-power-of-two proof branches"
          rm -rf /tmp/mvprobe

      - name: Merkle vector specification
        run: python3 spec/tools/spec_merkle_vectors_check.py

      # SGH. 토큰이 싣는 세계 조각의 해시(필드 61)를 규격만으로 재계산할 수 있는가.
      # 양성 대조: 동결 벡터의 바이트 하나를 바꾸면 S1 이 붉어야 한다 — 검사기가 실린
      # 파일을 실제로 읽고 있다는 증거다.
      - name: Positive control - altered subgraph vector
        run: |
          set -euo pipefail
          rm -rf /tmp/sgprobe
          cp -R "$PWD" /tmp/sgprobe
          printf '\n' >> /tmp/sgprobe/spec/subgraph-vectors/cases.json
          if ( cd /tmp/sgprobe && python3 spec/tools/spec_subgraph_check.py ); then
            echo "Unexpected result - Positive control - altered subgraph vector. Inspect the preceding command output."
            exit 1
          fi
          echo "Positive control confirmed - Positive control - altered subgraph vector"
          rm -rf /tmp/sgprobe

      - name: Subgraph snapshot hash specification
        run: python3 spec/tools/spec_subgraph_check.py

      # BT-1d. 위 검사기들은 전부 우리가 쓴 파이썬이고 우리 배치를 안다. 받은 사람이
      # 실제로 하는 일 — **실린 것만 가지고 검증기를 돌린다** — 은 아직 아무 데서도
      # 재지 않는다. 여기서 `cmd/pail-verify` 를 공개 배치 그대로 빌드하고 돌린다.
      # 이 도구는 벡터를 `../../spec/proof-vectors` 로 찾으므로, 이 단계가 초록이면
      # 공개 배치가 스스로 닫혀 있다는 뜻이고 붉으면 우리가 규격이나 벡터를 옮기면서
      # 받은 사람 쪽 경로를 깼다는 뜻이다.
      - uses: actions/setup-go@v5
        with:
          go-version-file: cloud/go.mod

      - name: Positive control - removed signature gate
        run: |
          set -euo pipefail
          rm -rf /tmp/pvprobe
          cp -R "$PWD" /tmp/pvprobe
          python3 - <<'PY'
          p = "/tmp/pvprobe/cmd/pail-verify/main.go"
          s = open(p, encoding="utf-8").read()
          old = "if ed25519.Verify(tr.pub, body, blob[4:]) {"
          if s.count(old) != 1:
              raise SystemExit("Cannot construct/validate CI control - Positive control - removed signature gate")
          open(p, "w", encoding="utf-8").write(s.replace(old, "if true {"))
          print("CI detail - Positive control - removed signature gate")
          PY
          if ( cd /tmp/pvprobe/cmd/pail-verify && go test -count=1 ./... ); then
            echo "Unexpected result - Positive control - removed signature gate. Inspect the preceding command output."
            exit 1
          fi
          echo "Positive control confirmed - Positive control - removed signature gate"
          rm -rf /tmp/pvprobe

      - name: Offline verifier against shipped vectors
        run: cd cmd/pail-verify && go vet ./... && go test -count=1 ./...

      # SGH-2. 토큰의 세계 조각 해시를 원장과 사이트 선언만으로 재계산하는 도구. 양성 대조:
      # 실린 원장의 바이트 하나를 뒤집으면 체인이 깨져 「발견」(rc=1)이어야 한다 — 도구가
      # 실린 세그먼트를 실제로 읽고 체인을 재는 증거다.
      - name: Positive control - broken ledger chain
        run: |
          set -euo pipefail
          rm -rf /tmp/prprobe
          cp -R "$PWD" /tmp/prprobe
          python3 - <<'PY'
          p = "/tmp/prprobe/cmd/pail-recompute/testdata/fixture1/journal/pail_blackbox.00000001.seg"
          b = bytearray(open(p, "rb").read())
          b[len(b) // 2] ^= 1
          open(p, "wb").write(b)
          PY
          cd /tmp/prprobe/cmd/pail-recompute
          go build -o /tmp/pail-recompute-probe .
          if /tmp/pail-recompute-probe ledger -site testdata/fixture1/site.yaml -journal testdata/fixture1/journal; then
            echo "Unexpected result - Positive control - broken ledger chain. Inspect the preceding command output."
            exit 1
          fi
          echo "Positive control confirmed - Positive control - broken ledger chain"
          rm -rf /tmp/prprobe /tmp/pail-recompute-probe

      - name: World-hash recomputation tool against shipped vectors and fixture
        run: |
          cd cmd/pail-recompute && go vet ./... && go test -count=1 ./... && \
          go run . vectors -dir ../../spec/subgraph-vectors && \
          go run . ledger -site testdata/fixture1/site.yaml -journal testdata/fixture1/journal

      # BT-1e. 위 단계가 초록이라는 것은 **어떤** 키로 열린다는 뜻이지 **옳은** 키로
      # 열린다는 뜻이 아니다. 실린 `spec/proof-vectors/checkpoint.vkey` 를 물리면
      # `checkpoint OK` 에 rc=0 이 나는데, 그 키는 개인 절반이 디스크에 쓰인 적이 없다.
      # `spec/trust-roots.tsv` 가 그것을 `not-anchor` 로 분류하고, 아래 검사기가
      # **공개 트리 전수에서 vkey 꼴을 유도해** 등재부와 양방향 대조한다.
      - name: Positive control - empty source scan
        run: |
          set -euo pipefail
          rm -rf /tmp/trprobe
          cp -R "$PWD" /tmp/trprobe
          # 이 변형은 2026-08-30 에 실제로 저지른 것이다: base64 마지막 글자에 없는
          # 제약을 상상해 붙였더니 545개 파일에서 0건을 찾고도 초록이었다. 유도식
          # 스캔의 침묵은 **찾을 것이 없는 트리와 같은 바이트**다.
          python3 - <<'PY'
          p = "/tmp/trprobe/spec/tools/spec_trust_root_check.py"
          s = open(p, encoding="utf-8").read()
          old = "[A-Za-z0-9+/]{44})"
          if s.count(old) != 1:
              raise SystemExit("Cannot construct/validate CI control - Positive control - empty source scan")
          open(p, "w", encoding="utf-8").write(s.replace(old, "[A-Za-z0-9+/]{43}[AQgw])"))
          print("CI detail - Positive control - empty source scan")
          PY
          if ( cd /tmp/trprobe && python3 spec/tools/spec_trust_root_check.py ); then
            echo "Unexpected result - Positive control - empty source scan. Inspect the preceding command output."
            exit 1
          fi
          echo "Positive control confirmed - Positive control - empty source scan"
          rm -rf /tmp/trprobe

      - name: Positive control - unregistered verification key
        run: |
          set -euo pipefail
          rm -rf /tmp/trprobe
          cp -R "$PWD" /tmp/trprobe
          # 여기서 깨는 것은 도구가 아니라 **트리**다. 내일 누군가 키를 한 줄 실어
          # 보내는 일이 이 형상이고, 그때 조용하면 등재부는 장식이다.
          python3 - <<'PY'
          import base64, hashlib, os
          raw = b"\x01" + hashlib.sha256(b"BT-1e ci probe").digest()
          line = "probe-log+00000000+" + base64.b64encode(raw).decode()
          os.makedirs("/tmp/trprobe/docs", exist_ok=True)
          with open("/tmp/trprobe/docs/PROBE.md", "w", encoding="utf-8") as fh:
              fh.write("# probe\n\n    " + line + "\n")
          print("CI detail - Positive control - unregistered verification key")
          PY
          if ( cd /tmp/trprobe && python3 spec/tools/spec_trust_root_check.py ); then
            echo "Unexpected result - Positive control - unregistered verification key. Inspect the preceding command output."
            exit 1
          fi
          echo "Positive control confirmed - Positive control - unregistered verification key"
          rm -rf /tmp/trprobe

      - name: Trust root registry
        run: python3 spec/tools/spec_trust_root_check.py

      # BT-1f. 위 단계들은 검증기가 **돈다**는 것을 잰다. README 가 그 검증기에 대해
      # **주장하는 것**은 2026-08-31 까지 아무 데서도 유도되지 않았다. 아래 두 대조군이
      # 그날 실측한 두 형상이다 — 둘 다 그때는 `go vet`·`go test`·검사기 9종이 전부
      # rc=0 이었다. 도구가 도는 것과 문서가 그 도구에 대해 참인 것은 다른 조건이다.
      - name: Positive control - external verifier dependency
        run: |
          set -euo pipefail
          rm -rf /tmp/vcprobe
          cp -R "$PWD" /tmp/vcprobe
          # 선언 평면만 깬다: `require` 만 늘고 import 는 그대로라 **빌드도 시험도
          # 통과한다**. "표준 라이브러리만 쓴다"는 문장이 재는 것이 있는지를 묻는다.
          printf '\nrequire google.golang.org/grpc v1.62.0\n' \
            >> /tmp/vcprobe/cmd/pail-verify/go.mod
          if ( cd /tmp/vcprobe && python3 spec/tools/spec_verifier_claims_check.py ); then
            echo "Unexpected result - Positive control - external verifier dependency. Inspect the preceding command output."
            exit 1
          fi
          echo "Positive control confirmed - Positive control - external verifier dependency"
          rm -rf /tmp/vcprobe

      - name: Positive control - divergent exit literal
        run: |
          set -euo pipefail
          rm -rf /tmp/vcprobe
          cp -R "$PWD" /tmp/vcprobe
          # 실린 시험은 종료값을 **상수에 대고** 잰다(`got != exitCannot`). 그래서
          # 상수를 바꾸면 양변이 함께 움직이고 시험은 통과한다 — 문서가 선언한
          # 리터럴 `0/1/2` 는 측정되지 않는다. `H-B2` 를 집행하려고 만든 도구
          # 안에서 `H-B2` 가 재현된 자리다.
          python3 - <<'PY'
          p = "/tmp/vcprobe/cmd/pail-verify/main.go"
          s = open(p, encoding="utf-8").read()
          old = "exitCannot   = 2"
          if s.count(old) != 1:
              raise SystemExit("Cannot construct/validate CI control - Positive control - divergent exit literal")
          open(p, "w", encoding="utf-8").write(s.replace(old, "exitCannot   = 3"))
          print("CI detail - Positive control - divergent exit literal")
          PY
          if ( cd /tmp/vcprobe && python3 spec/tools/spec_verifier_claims_check.py ); then
            echo "Unexpected result - Positive control - divergent exit literal. Inspect the preceding command output."
            exit 1
          fi
          echo "Positive control confirmed - Positive control - divergent exit literal"
          rm -rf /tmp/vcprobe

      - name: Verifier claims
        run: python3 spec/tools/spec_verifier_claims_check.py

      # BT-1g. 위 단계까지는 실린 테스트의 **초록**이 검증기를 믿을 근거였다.
      # 2026-08-31 실측: 거부 관문을 하나씩 통째로 떼고 그 테스트를 그대로
      # 돌렸더니 39개 중 23개가 rc=0 이었다 — 초록은 「관문이 산다」가 아니라
      # 「관문의 생사를 아무도 재지 않는다」였고, 요약에서 둘은 같은 글자다.
      - name: Positive control - unregistered guard
        run: |
          set -euo pipefail
          rm -rf /tmp/gdprobe
          cp -R "$PWD" /tmp/gdprobe
          # 등재부는 자기가 아는 것만 지킨다. 새 거부 자리는 등재부에 없으므로
          # **무색**이고, 무색인 칸은 요약에서 「통과」로 읽힌다. 거부 자리 집합의
          # 크기와 SHA-256 을 핀한 것이 그 자리를 붉히는지 묻는다.
          python3 - <<'PY'
          p = "/tmp/gdprobe/cmd/pail-verify/main.go"
          s = open(p, encoding="utf-8").read()
          old = "\tif len(root) != sha256.Size {"
          if s.count(old) != 1:
              raise SystemExit("Cannot construct/validate CI control - Positive control - unregistered guard")
          new = ('\tif len(lines[0]) > 4096 {\n'
                 '\t\treturn nil, fmt.Errorf("%w: origin line is absurdly long", errMalformed)\n'
                 '\t}\n' + old)
          open(p, "w", encoding="utf-8").write(s.replace(old, new, 1))
          print("CI detail - Positive control - unregistered guard")
          PY
          if ( cd /tmp/gdprobe && python3 spec/tools/spec_guards_check.py ); then
            echo "Unexpected result - Positive control - unregistered guard. Inspect the preceding command output."
            exit 1
          fi
          echo "Positive control confirmed - Positive control - unregistered guard"
          rm -rf /tmp/gdprobe

      - name: Positive control - ineffective guard evidence
        run: |
          set -euo pipefail
          rm -rf /tmp/gdprobe
          cp -R "$PWD" /tmp/gdprobe
          # 「그 이름의 테스트가 있다」와 「그 테스트가 그 관문을 잰다」는 다른
          # 조건이다. 정적 모드는 앞의 것까지만 잰다 — 뒤의 것은 --mutate 만
          # 답한다. 실린 이름으로 바꿔치기해도 정적 모드는 조용해야 정상이고,
          # --mutate 는 붉어야 한다. 그 차이가 없으면 --mutate 는 장식이다.
          python3 - <<'PY'
          p = "/tmp/gdprobe/cmd/pail-verify/GUARDS.tsv"
          s = open(p, encoding="utf-8").read()
          old = "G15\tcovered\tTestForgedSignatureRejected\t"
          if s.count(old) != 1:
              raise SystemExit("Cannot construct/validate CI control - Positive control - ineffective guard evidence")
          new = "G15\tcovered\tTestUnknownArgumentRefuses\t"
          open(p, "w", encoding="utf-8").write(s.replace(old, new, 1))
          print("CI detail - Positive control - ineffective guard evidence")
          PY
          if ! ( cd /tmp/gdprobe && python3 spec/tools/spec_guards_check.py ); then
            echo "Unexpected result - Positive control - ineffective guard evidence. Inspect the preceding command output."
            exit 1
          fi
          if ( cd /tmp/gdprobe && python3 spec/tools/spec_guards_check.py --mutate --only=G15 > /tmp/gdprobe-mutate.log 2>&1 ); then
            echo "Unexpected result - Positive control - ineffective guard evidence. Inspect the preceding command output."
            cat /tmp/gdprobe-mutate.log
            exit 1
          fi
          # A non-zero exit is not enough: when the unmodified baseline itself is red the checker stops with a
          # prerequisite failure (exit 2) and no mutation was measured. That must fail this control, not confirm it
          # (first public run, 2026-11-04: the control "confirmed" itself through exactly that failure).
          if grep -q 'prerequisite failure' /tmp/gdprobe-mutate.log; then
            echo "Unexpected result - Positive control - ineffective guard evidence: the measurement could not run; a prerequisite failure is not a detected mutation."
            cat /tmp/gdprobe-mutate.log
            exit 1
          fi
          grep -E '^SPEC-GUARDS: ' /tmp/gdprobe-mutate.log || true
          echo "Positive control confirmed - Positive control - ineffective guard evidence"
          rm -rf /tmp/gdprobe /tmp/gdprobe-mutate.log

      - name: Guard registry (static)
        run: python3 spec/tools/spec_guards_check.py

      - name: Guard mutation measurements
        run: python3 spec/tools/spec_guards_check.py --mutate

      # SK-8. 스킬 등재부에는 파서가 **둘**이라는 사정이 있다 — 이슈어(Go)와
      # 게이트(C++)가 같은 바이트를 각자 읽는다. 그래서 대조군도 둘이다: 한쪽
      # 파서만 깨면 그 축만 붉어야 하고, 둘이 함께 붉으면 이 검사기는 두 파서를
      # 따로 재는 것이 아니라 하나로 뭉쳐 보고 있다는 뜻이다.
      #
      # 여기서도 **소스만** 건드린다. 이 규격서가 겨누는 실패는 손으로 쓴 문서가
      # 파서보다 오래 사는 것이라 대조군은 파서 쪽에서 와야 한다.
      - name: Positive control - missing issuer parser field
        run: |
          set -euo pipefail
          rm -rf /tmp/skl && cp -R "$PWD" /tmp/skl
          python3 - <<'PY'
          import re
          p = "/tmp/skl/cloud/internal/skills/skills.go"
          s = open(p, encoding="utf-8").read()
          new, n = re.subn(r'^\t*Slot\s+string\s+`yaml:"slot"`\n', "", s, flags=re.M)
          if n != 1:
              raise SystemExit("Cannot construct/validate CI control - Positive control - missing issuer parser field")
          open(p, "w", encoding="utf-8").write(new)
          print("CI detail - Positive control - missing issuer parser field")
          PY
          if ( cd /tmp/skl && python3 spec/tools/spec_skills_check.py ); then
            echo "Unexpected result - Positive control - missing issuer parser field. Inspect the preceding command output."
            exit 1
          fi
          echo "Positive control confirmed - Positive control - missing issuer parser field"
          rm -rf /tmp/skl

      - name: Positive control - missing gate parser field
        run: |
          set -euo pipefail
          rm -rf /tmp/skl && cp -R "$PWD" /tmp/skl
          python3 - <<'PY'
          p = "/tmp/skl/libpail_gate/src/skills_load.cpp"
          s = open(p, encoding="utf-8").read()
          old = '"slot", '
          if s.count(old) != 1:
              raise SystemExit("Cannot construct/validate CI control - Positive control - missing gate parser field")
          open(p, "w", encoding="utf-8").write(s.replace(old, "", 1))
          print("CI detail - Positive control - missing gate parser field")
          PY
          if ( cd /tmp/skl && python3 spec/tools/spec_skills_check.py ); then
            echo "Unexpected result - Positive control - missing gate parser field. Inspect the preceding command output."
            exit 1
          fi
          echo "Positive control confirmed - Positive control - missing gate parser field"
          rm -rf /tmp/skl

      - name: Skill registry contract
        run: python3 spec/tools/spec_skills_check.py

      # A/B/C bundle boundary. PAIL-Core (Apache-2.0) must never import PAIL-Issuer
      # (the issuing bundle, not part of a Core delivery); the Go toolchain enforces it for cloud/issuer/internal/, and this
      # checker measures the whole boundary — direction, per-bundle SPDX headers, the
      # bundle-B licence parameters, the absence of the private set and the HA seam. The control
      # plants one issuer import into a PAIL-Core source file.
      - name: Positive control - PAIL-Core importing the issuer
        run: |
          set -euo pipefail
          rm -rf /tmp/bnd && cp -R "$PWD" /tmp/bnd
          python3 - <<'PY'
          p = "/tmp/bnd/cloud/cmd/blackbox_verify/main.go"
          s = open(p, encoding="utf-8").read()
          if "issuer/internal/grpcserver" in s:
              raise SystemExit("Cannot construct/validate CI control - Positive control - PAIL-Core importing the issuer")
          s += '\nimport _ "github.com/glowfly/pail/services/issuer/internal/grpcserver"\n'
          open(p, "w", encoding="utf-8").write(s)
          print("CI detail - Positive control - PAIL-Core importing the issuer")
          PY
          rc=0; ( cd /tmp/bnd && python3 spec/tools/spec_bundle_check.py ) || rc=$?
          # rc 1 = a finding. rc 2 = the checker could not measure; that is not a confirmation.
          if [ "$rc" -ne 1 ]; then
            echo "Unexpected result (rc=$rc, want 1) - Positive control - PAIL-Core importing the issuer. Inspect the preceding command output."
            exit 1
          fi
          echo "Positive control confirmed - Positive control - PAIL-Core importing the issuer"
          rm -rf /tmp/bnd

      - name: Positive control - issuer file under the Apache header
        run: |
          set -euo pipefail
          rm -rf /tmp/bnd && cp -R "$PWD" /tmp/bnd
          python3 - <<'PY'
          import os
          p = "/tmp/bnd/cloud/issuer/internal/grpcserver/server.go"
          if os.path.exists(p):
              s = open(p, encoding="utf-8").read()
              old = "SPDX-License-Identifier: BUSL-1.1"
              if s[:400].count(old) != 1:
                  raise SystemExit("Cannot construct/validate CI control - Positive control - issuer file under the Apache header")
              open(p, "w", encoding="utf-8").write(s.replace(old, "SPDX-License-Identifier: Apache-2.0", 1))
              print("CI detail - Positive control - issuer file under the Apache header")
          else:
              # A PAIL-Core-only tree carries no issuer bundle (0.2.0 ships no Issuer source). The direction under
              # test — a file under cloud/issuer/ that claims the Apache header — is then planted synthetically, so
              # the control still measures the checker instead of dying on a missing file (first run of this step
              # on the public tree, 2026-11-04).
              os.makedirs(os.path.dirname(p))
              open(p, "w", encoding="utf-8").write("// SPDX-License-Identifier: Apache-2.0\npackage grpcserver\n")
              print("CI detail - Positive control - issuer file under the Apache header (Core-only tree: synthetic issuer file planted)")
          PY
          rc=0; ( cd /tmp/bnd && python3 spec/tools/spec_bundle_check.py > /tmp/bnd-out.log 2>&1 ) || rc=$?
          cat /tmp/bnd-out.log
          # rc 1 = a finding. rc 2 = the checker could not measure; that is not a confirmation. And the finding has
          # to be the one this control provokes (B2 on that file), not some other row that happened to be red.
          if [ "$rc" -ne 1 ] || ! grep -q 'B2: cloud/issuer/internal/grpcserver/server.go' /tmp/bnd-out.log; then
            echo "Unexpected result (rc=$rc, want 1 with a B2 finding on the planted file) - Positive control - issuer file under the Apache header. Inspect the preceding command output."
            exit 1
          fi
          echo "Positive control confirmed - Positive control - issuer file under the Apache header"
          rm -rf /tmp/bnd /tmp/bnd-out.log

      # B7/B8 run from this bare checkout: the declaration of bundle-B files outside
      # cloud/issuer/ lives in the checker (B_OUTSIDE_ISSUER), so no delivery manifest is
      # needed here. These two controls prove that on every run — one strips the bundle-B SPDX
      # header from a declared file, the other plants a bundle-B SPDX header on a PAIL-Core file.
      - name: Positive control - declared issuer file loses its bundle-B SPDX header
        run: |
          set -euo pipefail
          rm -rf /tmp/bnd && cp -R "$PWD" /tmp/bnd
          python3 - <<'PY'
          import os
          p = "/tmp/bnd/examples/perf/WORKLOADS.yaml"
          if os.path.exists(p):
              s = open(p, encoding="utf-8").read()
              first, rest = s.split("\n", 1)
              if "SPDX-License-Identifier: BUSL-1.1" not in first:
                  raise SystemExit("Cannot construct/validate CI control - Positive control - declared issuer file loses its bundle-B SPDX header")
              open(p, "w", encoding="utf-8").write(rest)
              print("CI detail - Positive control - declared issuer file loses its bundle-B SPDX header")
          else:
              # A PAIL-Core-only tree carries neither the issuer bundle nor its declared outside files. B7 is only
              # measured in a tree that carries cloud/issuer/, so the control plants a minimal issuer bundle and
              # the declared file without its bundle-B header; the checker must then name that file.
              g = "/tmp/bnd/cloud/issuer/internal/grpcserver/server.go"
              os.makedirs(os.path.dirname(g))
              open(g, "w", encoding="utf-8").write("// SPDX-License-Identifier: BUSL-1.1\npackage grpcserver\n")
              os.makedirs(os.path.dirname(p), exist_ok=True)
              open(p, "w", encoding="utf-8").write("workloads: []\n")
              print("CI detail - Positive control - declared issuer file loses its bundle-B SPDX header (Core-only tree: synthetic bundle B planted)")
          PY
          rc=0; ( cd /tmp/bnd && python3 spec/tools/spec_bundle_check.py > /tmp/bnd-out.log 2>&1 ) || rc=$?
          cat /tmp/bnd-out.log
          if [ "$rc" -ne 1 ] || ! grep -q 'B7: examples/perf/WORKLOADS.yaml is bundle B outside' /tmp/bnd-out.log; then
            echo "Unexpected result (rc=$rc, want 1 with a B7 finding on the declared file) - Positive control - declared issuer file loses its bundle-B SPDX header. Inspect the preceding command output."
            exit 1
          fi
          echo "Positive control confirmed - Positive control - declared issuer file loses its bundle-B SPDX header"
          rm -rf /tmp/bnd /tmp/bnd-out.log

      - name: Positive control - undeclared file claims the bundle-B SPDX header
        run: |
          set -euo pipefail
          rm -rf /tmp/bnd && cp -R "$PWD" /tmp/bnd
          python3 - <<'PY'
          # A non-source file, so exactly one observation point (B8) can answer.
          p = "/tmp/bnd/examples/tb3/compose.yaml"
          s = open(p, encoding="utf-8").read()
          if "SPDX-License-Identifier: BUSL-1.1" in s:
