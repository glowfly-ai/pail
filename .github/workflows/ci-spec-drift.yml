            exit 1
          fi
          echo "Positive control confirmed - Positive control - undeclared file claims the bundle-B SPDX header"
          rm -rf /tmp/bnd

      - name: Bundle boundary contract
        run: python3 spec/tools/spec_bundle_check.py

      - name: Positive control - dashboard script requests the robot-operations endpoint without the page capability
        run: |
          set -euo pipefail
          rm -rf /tmp/clsprobe && cp -R "$PWD" /tmp/clsprobe
          python3 - <<'PY'
          p = "/tmp/clsprobe/cloud/cmd/pail_telemetryd/dashboard/robotops.js"
          s = open(p, encoding="utf-8").read()
          if 'meta[name="pail-robotops"]' not in s:
