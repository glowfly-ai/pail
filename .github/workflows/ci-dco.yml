# Public CI: every commit of a pull request carries a Developer Certificate of Origin sign-off
# (CONTRIBUTING.md section 1). This is the check that sentence names; it needs no external app.
# A merge commit is skipped; every other commit in the range must contain a `Signed-off-by:` trailer.
name: dco

on: [pull_request]

permissions:
  contents: read

jobs:
  signoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          missing=0
          for c in $(git rev-list --no-merges "$BASE".."$HEAD"); do
            if ! git show -s --format=%B "$c" | grep -Eq '^Signed-off-by: .+ <.+@.+>$'; then
              echo "missing Signed-off-by: $c $(git show -s --format=%s "$c")"; missing=1
            fi
          done
          [ "$missing" = 0 ] || { echo 'add the trailer with `git commit -s` (see CONTRIBUTING.md section 1)'; exit 1; }
          echo "every commit in the range is signed off"
