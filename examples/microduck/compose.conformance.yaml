services:
  token-seam:
    image: ${PAIL_DUCK_IMAGE}
    user: "10001:10001"
    networks: [preview]
    cap_drop: [ALL]
    volumes: [run:/run/duck]
    command: [python, /opt/pail/pvs/runner/adapters/token_seam_server.py, --listen, "0.0.0.0:50052", --upstream, "agent:50051", --ctl, /run/duck/seam.ctl]
  state-seam:
    image: ${PAIL_DUCK_IMAGE}
    user: "10001:10001"
    networks: [preview]
    cap_drop: [ALL]
    volumes: [run:/run/duck]
    command: [python, /opt/pail/pvs/runner/adapters/duck_state_seam.py, --listen, /run/duck/raw/state-seam.sock, --upstream, /run/duck/raw/robotd.sock, --ctl, /run/duck/state.ctl, --tap-log, /run/duck/ca16-tap.jsonl]
  adapter:
    command: [pail-duckd, --public, /run/duck/pail.sock, --public-gid, "10002", --raw, /run/duck/raw/state-seam.sock, --agent, "http://token-seam:50052", --robot-id, robot-1, --policy, /etc/pail/policy.yaml, --keyring, /etc/pail/keys/keyring.json, --skills, /etc/pail/duck_skills.yaml, --evidence, /run/duck/evidence.sock, --gate-log, /run/duck/gate.ndjson]
  observe-issuer:
    image: ${PAIL_DUCK_ISSUER_IMAGE:?Load the pinned Issuer evaluation image}
    user: "10001:10001"
    networks: [preview]
    cap_drop: [ALL]
    command: [pail_cloud]
    volumes:
      - type: volume
        source: private
        target: /etc/pail
        volume: {subpath: config}
      - type: volume
        source: private
        target: /var/log/pail_blackbox
        volume: {subpath: observe-blackbox}
    environment:
      PAIL_CLOUD_PORT: "50051"
      PAIL_PROFILE: dev
      PAIL_GRPC_TLS: "off"
      PAIL_ISSUER_KEY_ID: dev-key-1
      PAIL_KEYRING_MODE: unsigned-dev
      PAIL_ROBOT_ID: robot-1
      PAIL_SITE_MODEL: /etc/pail/site_model.yaml
      PAIL_REQUESTERS: /etc/pail/requesters.not-provided.yaml
      PAIL_CHECKPOINT_EVERY_RECORDS: "1"
  observe-agent:
    image: ${PAIL_DUCK_IMAGE}
    user: "10001:10001"
    networks: [preview]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 0.3
    mem_limit: 384m
    pids_limit: 256
    command: [pail_robot_agent]
    volumes:
      - ${PAIL_DUCK_STATE}/public/config:/etc/pail:ro
      - type: volume
        source: private
        target: /run/pail-secrets
        read_only: true
        volume: {subpath: agent-key}
      - run:/run/duck
    environment:
      PAIL_PROFILE: dev
      PAIL_GRPC_TLS: "off"
      PAIL_KEYRING_MODE: unsigned-dev
      PAIL_ROBOT_ID: robot-1
      PAIL_CLOUD_ADDR: observe-issuer:50051
      PAIL_AGENT_KEY: /run/pail-secrets/agent_ed25519.json
      PAIL_REPORT_QUEUE_DIR: /run/duck/observe-report_queue
  observe-fake:
    image: ${PAIL_DUCK_IMAGE}
    user: "10001:10001"
    networks: [preview]
    cap_drop: [ALL]
    volumes: [run:/run/duck]
    command: [robotd, --fake, --no-policy, --socket, /run/duck/raw/observe-robotd.sock]
  observe:
    image: ${PAIL_DUCK_IMAGE}
    user: "10001:10001"
    group_add: ["10002"]
    cap_drop: [ALL]
    networks: [preview]
    volumes:
      - run:/run/duck
      - ${PAIL_DUCK_STATE}/public/config:/etc/pail:ro
    environment:
      PAIL_PROFILE: production
      PAIL_KEYRING_MODE: unsigned-dev
      PAIL_BUILD_INFO: "pail-build:v1:pep_gate:0.1.0-microduck-preview:-:-:-"
    command: [pail-duckd, --public, /run/duck/pail_observe.sock, --public-gid, "10002", --raw, /run/duck/raw/observe-robotd.sock, --agent, "http://observe-agent:50051", --robot-id, robot-1, --policy, /etc/pail/policy.observe.yaml, --keyring, /etc/pail/keys/keyring.json, --skills, /etc/pail/duck_skills.yaml, --gate-log, /run/duck/gate_observe.ndjson]
  harness:
    environment:
      PAIL_DUCK_OBSERVE_RAW: /run/duck/raw/observe-robotd.sock
      PAIL_DUCK_OBSERVE_ISSUER: observe-issuer:50051
      PAIL_DUCK_OBSERVE_BLACKBOX: /state/private/observe-blackbox
      PAIL_DUCK_ADAPTER_CTR: adapter
      PAIL_DUCK_ISSUER_CTR: issuer
      PAIL_DUCK_AGENT_CTR: token-seam
      PAIL_DUCK_SEAM_CTL: /run/duck/seam.ctl
      PAIL_DUCK_STATE_CTL: /run/duck/state.ctl
