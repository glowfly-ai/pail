<!doctype html><!-- SPDX-License-Identifier: Apache-2.0; Copyright 2026 Glowfly Identity Systems Co.,Ltd --><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Microduck software fleet</title>
<style>body{font:16px system-ui;max-width:960px;margin:2rem auto;padding:1rem;background:#101827;color:#e6edf3}button,input,select{font:inherit;padding:.7rem;margin:.3rem;background:#f4f6f8;color:#101827;border:1px solid #526179;border-radius:4px}section{border:1px solid #526179;padding:1rem;margin:1rem 0}pre{white-space:pre-wrap}a{color:#8ab4ff}
.card{display:grid;grid-template-columns:auto 1fr;gap:.2rem 1rem;margin:.4rem 0 .8rem}.card span:nth-child(odd){color:#9fb0c6}.summary{font-weight:600}.open{display:inline-block;margin:.2rem 0 .6rem;font-weight:600}</style>
<h1 data-i18n="title">Microduck software fleet</h1><p><button id="langBtn" type="button">한국어</button> <span data-i18n="note">Software simulation · no physical robot. A submitted plan is not proof of observed motion.</span> <span id="transport">transport loading</span></p>
<p><a id="dashboard" hidden data-i18n="dashboard">Read-only fleet dashboard</a></p><form id="command"><label><span data-i18n="robot">Robot</span> <select id="robot" required><option value="" data-i18n="choose">Choose a robot</option></select></label><label><span data-i18n="commandLabel">Command</span> <input id="text" required placeholder="forward 0.2m"></label><button data-i18n="send">Send</button></form><p id="result" role="status"></p><div id="robots"></div>
<script>
const T={en:{title:'Microduck software fleet',note:'Software simulation · no physical robot. A submitted plan is not proof of observed motion.',dashboard:'Read-only fleet dashboard',robot:'Robot',choose:'Choose a robot',commandLabel:'Command',send:'Send',
 mtls:'mTLS issuer/agent + local adapter UDS',plain:'isolated plaintext development transport',state:'State',plan:'Latest plan',pose:'Last observed position',none:'none',unknown:'unknown',open:'Open the console of ',
 confirm:'Confirm recovery to idle (no motion)',noRecovery:'Recovery outcome unavailable. No new command was sent.',noObservation:'Observation unavailable; previous values are not current.',
 retry:'Outcome unknown. Retry uses the same request ID; it will not submit another plan.',summaryNote:'read from the collector',summaryGone:'the collector did not answer',
 MOVING:'Moving',IDLE_READY:'Ready, idle',ATTENTION:'Needs attention',UNKNOWN:'Unknown'},
 ko:{title:'Microduck 소프트웨어 fleet',note:'소프트웨어 모의 실험 · 실물 로봇 없음. 제출된 계획은 움직임이 관측됐다는 증명이 아닙니다.',dashboard:'읽기 전용 fleet 대시보드',robot:'로봇',choose:'로봇을 고르세요',commandLabel:'명령',send:'보내기',
 mtls:'mTLS 이슈어/에이전트 + 로컬 어댑터 UDS',plain:'격리된 평문 개발용 전송',state:'상태',plan:'최신 계획',pose:'마지막으로 관측된 위치',none:'없음',unknown:'알 수 없음',open:'콘솔 열기: ',
 confirm:'복구 확인 (움직임 없음)',noRecovery:'복구 결과를 알 수 없습니다. 새 명령은 보내지 않았습니다.',noObservation:'관측을 읽지 못했습니다. 이전 값은 현재 값이 아닙니다.',
 retry:'결과를 알 수 없습니다. 다시 보내면 같은 요청 ID를 쓰며 계획이 하나 더 생기지 않습니다.',summaryNote:'수집기에서 읽음',summaryGone:'수집기가 답하지 않음',
 MOVING:'이동 중',IDLE_READY:'정상 대기',ATTENTION:'확인 필요',UNKNOWN:'알 수 없음'}};
let lang=new URLSearchParams(location.search).get('lang')||localStorage.getItem('pail-demo-lang')||'en';if(!T[lang])lang='en';
const t=k=>T[lang][k]||T.en[k]||k;
function applyLang(){document.documentElement.lang=lang;document.querySelectorAll('[data-i18n]').forEach(e=>{e.textContent=t(e.dataset.i18n)});document.getElementById('langBtn').textContent=lang==='ko'?'English':'한국어';document.title=t('title')}
document.getElementById('langBtn').onclick=()=>{lang=lang==='ko'?'en':'ko';localStorage.setItem('pail-demo-lang',lang);applyLang();refresh()};
let pending=null,summary={};
// The summary state is the collector's judgement. It is asked for apart from the robot states: a
// collector that does not answer leaves the states of the robots as they are and says so.
async function readSummary(){try{let r=await fetch('/api/summary');summary=r.ok?await r.json():{error:true}}catch(e){summary={error:true}}}
function field(box,name,value){let a=document.createElement('span'),b=document.createElement('span');a.textContent=name;b.textContent=value;box.append(a,b);return b}
async function refresh(){try{let s=await(await fetch('/api/state')).json();document.getElementById('transport').textContent='· '+(s.profile==='software-fleet-mtls'?t('mtls'):t('plain'));if(s.dashboard_url){let a=document.getElementById('dashboard');a.href=s.dashboard_url+'&lang='+lang;a.hidden=false;}let list=document.getElementById('robot');for(let r of s.robots){if(!Array.from(list.options).some(o=>o.value===r.robot_id)){let o=document.createElement('option');o.value=r.robot_id;o.textContent=r.robot_id;list.append(o);}}let box=document.getElementById('robots');box.replaceChildren();for(let r of s.robots){let e=document.createElement('section'),h=document.createElement('h2'),p=document.createElement('pre');e.dataset.robot=r.robot_id;h.textContent=r.robot_id;
 let card=document.createElement('div'),sum=(summary.robots||{})[r.robot_id],link=document.createElement('a');card.className='card';
 let st=field(card,t('state'),summary.error?t('unknown')+' (UNKNOWN) · '+t('summaryGone'):sum?t(sum.state)+' ('+sum.state+')'+(sum.reason?' · '+sum.reason:'')+' · '+t('summaryNote'):t('unknown')+' (UNKNOWN)');st.className='summary';st.dataset.summary=summary.error||!sum?'UNKNOWN':sum.state;
 field(card,t('plan'),r.plan?(r.plan.text||'')+' · '+(r.plan.ended||(lang==='ko'?'진행 중':'running')):t('none'));
 field(card,t('pose'),r.pose?'x '+Number(r.pose.x).toFixed(2)+' m · y '+Number(r.pose.y).toFixed(2)+' m':t('unknown'));
 link.className='open';link.href='/robot/'+encodeURIComponent(r.robot_id)+'/?lang='+lang;link.textContent=t('open')+r.robot_id;
 p.textContent=JSON.stringify({plan:r.plan,last_observed_pose:r.pose,recovery:r.recovery},null,2);e.append(h,card,link,p);if(r.recovery?.paused){let b=document.createElement('button');b.textContent=t('confirm');b.onclick=async()=>{try{let response=await fetch('/api/recovery',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({robot_id:r.robot_id,confirmation:true})}),result=await response.json();document.getElementById('result').textContent=JSON.stringify(result);if(response.ok&&pending?.robot_id===r.robot_id)pending=null;}catch(error){document.getElementById('result').textContent=t('noRecovery')}refresh();};e.append(b);}box.append(e);}}catch(e){document.getElementById('result').textContent=t('noObservation')}}
document.getElementById('command').onsubmit=async e=>{e.preventDefault();let rid=document.getElementById('robot').value,text=document.getElementById('text').value;if(!pending||pending.robot_id!==rid||pending.text!==text)pending={robot_id:rid,text,request_id:crypto.randomUUID()};try{let r=await(await fetch('/api/command',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(pending)})).json();document.getElementById('result').textContent=JSON.stringify(r);if(r.execution!=='UNKNOWN'&&!r.error)pending=null;}catch(e){document.getElementById('result').textContent=t('retry')}};
applyLang();refresh();setInterval(refresh,1000);readSummary().then(refresh);setInterval(readSummary,2000);
</script></html>
